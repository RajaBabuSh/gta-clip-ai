# ==============================================================================
# GTA CLIP AI - Production Nginx Configuration
# Separate Frontend (Core PHP) + Decoupled AI Microservice (FastAPI)
# ==============================================================================

server {
    listen 80;
    server_name gtaclip.ai www.gtaclip.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gtaclip.ai www.gtaclip.ai;

    # SSL Certificates (e.g. Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/gtaclip.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtaclip.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Document Root: Core PHP Main Website
    root /var/www/gtaclipai;
    index index.php index.html;

    client_max_body_size 500M;
    client_body_timeout 300s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Main Website Frontend Routing (Core PHP)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute PHP files via PHP-FPM 8.2
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    # Protect sensitive configuration files and directories
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(app/config|backups)/ {
        deny all;
        return 404;
    }

    # 2. Decoupled AI Backend Microservice (FastAPI on Port 8000 or Vercel proxy)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # FastAPI Documentation
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Static Media Storage
    location /storage/ {
        alias /var/www/gtaclipai/storage/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
